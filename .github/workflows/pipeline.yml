name: Daily AI Pipeline
on:
  schedule:
    - cron: '30 07 * * *'  # Runs daily at 07:30 UTC
  workflow_dispatch:      # Allows manual trigger from GitHub
jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # ← required to push the ledger back to repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main       # ← always checkout latest main
          fetch-depth: 0  # ← fetch full history to avoid stale state
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Pull latest changes
        run: |
          git pull origin main  # ← ensure ledger is fully up to date before running
      - name: Run pipeline
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MAX_POSTS_PER_RUN: ${{ secrets.MAX_POSTS_PER_RUN }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
        run: |
          python src/main.py
      - name: Commit updated ledger
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          echo "Ledger contents before commit:"
          cat processed_urls.json | python -c "import json,sys; d=json.load(sys.stdin); print(f'URL count: {len(d)}')"
          git add processed_urls.json
          git diff --staged --quiet || git commit -m "Update processed URLs ledger [skip ci]"
          git push
